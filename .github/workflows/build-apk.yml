name: Build My AI Robot Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publish direct APK to GitHub Releases (easier to download on Android)'
        required: false
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    name: Build & Package Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Prepare Build Secrets & Environment
        run: |
          # Ensure .env exists so Secrets Gradle plugin resolves BuildConfig
          if [ ! -f .env ]; then
            cp .env.example .env
          fi

          # Decode or generate debug.keystore required by signingConfigs
          if [ -f debug.keystore.base64 ]; then
            echo "Decoding debug.keystore from base64..."
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f debug.keystore ]; then
            echo "Generating new debug.keystore..."
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -alias androiddebugkey \
              -keypass android \
              -storepass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Make Gradle Wrapper Executable
        run: chmod +x gradlew

      - name: Run Build Checks and Unit Tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Assemble Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename and Prepare APK
        run: |
          mkdir -p output_apk
          cp app/build/outputs/apk/debug/app-debug.apk output_apk/MyAIRobot-v1.0.apk
          echo "APK generated successfully at output_apk/MyAIRobot-v1.0.apk"
          ls -lh output_apk/

      - name: Upload APK Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: My-AI-Robot-APK
          path: output_apk/MyAIRobot-v1.0.apk
          retention-days: 30

      - name: Create GitHub Release with Direct APK Download
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.create_release == true) || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v1.0-build-${{ github.run_number }}"
          name: "My AI Robot v1.0 (Build #${{ github.run_number }})"
          body: |
            ### 🤖 My AI Robot Android APK Build
            
            **Direct Download for Android Phones:**
            Download `MyAIRobot-v1.0.apk` below directly to your Android device to install without unzipping.
            
            - **Commit:** ${{ github.sha }}
            - **Build Date:** ${{ github.event.head_commit.timestamp || github.run_id }}
            - **Application ID:** `com.aistudio.myairobot.zktpwx`
            - **Type:** Debug Installable APK
          files: output_apk/MyAIRobot-v1.0.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
