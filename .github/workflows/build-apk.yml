name: Build My AI Robot Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publish direct APK to GitHub Releases (easier to download on phone)'
        required: false
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    name: Build & Package Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Accept Android SDK Licenses & Configure Platform
        run: |
          echo "Configuring Android SDK..."
          export ANDROID_HOME=$ANDROID_SDK_ROOT
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Prepare Secrets & Keystore
        run: |
          # 1. Ensure .env exists for Secrets Gradle plugin
          if [ ! -f .env ]; then
            if [ -f .env.example ]; then
              cp .env.example .env
            else
              echo "GEMINI_API_KEY=MY_GEMINI_API_KEY" > .env
            fi
          fi

          # 2. Ensure debug.keystore exists for signingConfigs
          if [ -f debug.keystore.base64 ]; then
            echo "Decoding debug.keystore from base64..."
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f debug.keystore ]; then
            echo "Generating fallback debug.keystore..."
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -alias androiddebugkey \
              -keypass android \
              -storepass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          # 3. Ensure Gradle wrapper jar exists
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "Generating Gradle wrapper..."
            gradle wrapper --gradle-version 9.3.1
          fi
          chmod +x gradlew || true

      - name: Assemble Debug APK
        run: |
          echo "Building APK..."
          ./gradlew assembleDebug --stacktrace --no-daemon || gradle assembleDebug --stacktrace --no-daemon

      - name: Verify and Package APK
        run: |
          mkdir -p output_apk
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk output_apk/MyAIRobot-v1.0.apk
            echo "SUCCESS: Found app-debug.apk and copied to output_apk/MyAIRobot-v1.0.apk"
            ls -lh output_apk/
          else
            echo "Searching for generated APK files..."
            find app/build/outputs/apk -name "*.apk" -exec cp {} output_apk/MyAIRobot-v1.0.apk \;
            ls -lh output_apk/
          fi

      - name: Upload APK as Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: My-AI-Robot-APK
          path: output_apk/MyAIRobot-v1.0.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release with Direct APK Download
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.create_release == true) || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' }}
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v1.0-build-${{ github.run_number }}"
          name: "My AI Robot v1.0 (Build #${{ github.run_number }})"
          body: |
            ### 🤖 My AI Robot Android APK Build
            
            **Direct Download for Android Phones:**
            Download `MyAIRobot-v1.0.apk` below directly to your Android device to install without unzipping.
            
            - **Commit:** ${{ github.sha }}
            - **Build Date:** ${{ github.event.head_commit.timestamp || github.run_id }}
            - **Application ID:** `com.aistudio.myairobot.zktpwx`
            - **Type:** Debug Installable APK
          files: output_apk/MyAIRobot-v1.0.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Background Tests (Non-blocking)
        continue-on-error: true
        run: |
          ./gradlew testDebugUnitTest --no-daemon || true
